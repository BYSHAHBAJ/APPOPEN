name: Sync Google Play Store Stats

on:
  schedule:
    # Run automatically every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual 1-click trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and Sync Play Store Downloads
        run: python scripts/sync_playstore.py

      - name: Commit and Push if Changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add json/update.json
          if git diff --staged --quiet; then
            echo "No changes in Play Store stats."
          else
            git commit -m "Auto-sync Google Play Store downloads [skip ci]"
            git push
          fi
